<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirm your Backbeat email</title></head>
<body style="font-family: ui-sans-serif, system-ui, sans-serif; line-height: 1.5; margin: 0; padding: 24px; color: #171717; background: #ffffff;">
  <main style="max-width: 480px; margin: 0 auto;">
    <h1 style="font-size: 24px;">Confirm your Backbeat email</h1>
    <p>Enter this six-digit code in Backbeat to continue creating your account.</p>
    <p style="font-size: 24px; font-weight: 600; letter-spacing: 6px;">{{ .Token }}</p>
    <p>If the code has expired, select Resend code on the confirmation screen.</p>
    <p>If you did not request this account, you can ignore this email. Do not share this code.</p>
  </main>
</body>
</html>
