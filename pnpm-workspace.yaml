# Keep dependency lifecycle scripts disabled in this local recovery branch.
# Unknown packages still require an explicit decision; nothing is allowlisted.
allowBuilds:
  sharp: false
  unrs-resolver: false

# Converge compatible edges; the documented minimatch security exception is patched below.
overrides:
  'lodash@': 4.18.1
  'ws@': 8.21.0
  'postcss@': 8.5.23
  'nanoid@': 3.3.18
  'browserslist@': 4.28.7
  'baseline-browser-mapping@': 2.11.0
  'source-map-js@': 1.2.2
  'vite@': 8.3.3
  'undici@': 8.12.2
  'eslint-plugin-react-hooks>zod': 4.6.6
  # GHSA-g3hv-75wg-m249: patched matcher; the CJS patch preserves legacy ESLint callers.
  'minimatch@<11.0.1': 11.0.4

patchedDependencies:
  minimatch@11.0.4: patches/minimatch@11.0.4.patch
