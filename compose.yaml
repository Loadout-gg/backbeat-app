services:
  backbeat:
    build:
      context: .
      dockerfile: ops/local/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_ANON_KEY: null
    ports:
      - "127.0.0.1:3101:3101"
    environment:
      BACKBEAT_ENV: development
      NEXT_PUBLIC_BACKBEAT_ENV: development
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55322
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "${NEXT_PUBLIC_SUPABASE_ANON_KEY}"
      NEXT_PUBLIC_DEV_SUPABASE_REDIRECT_URL: http://127.0.0.1:3101/onboarding
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_INTERNAL_URL: http://kong:8000
      SUPABASE_LINK_ANON_KEY: "${SUPABASE_LINK_ANON_KEY}"
    command: ["node", "ops/local/start.cjs"]
    restart: unless-stopped
